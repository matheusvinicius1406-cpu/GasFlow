# Hooks de pre-commit — lint Python (ruff) + higiene de arquivos.
# ESLint do frontend roda no CI (job frontend) — o mirror do pre-commit fixa
# versões antigas do eslint e duplicaria a configuração do repo.
#
# Instalação: pip install pre-commit && pre-commit install
# Execução manual: pre-commit run --all-files
#
# `desktop/dist/` é artefato de build versionado e fica FORA dos hooks que
# ESCREVEM no arquivo (trailing-whitespace, end-of-file-fixer, ruff --fix,
# ruff-format): o `tsc` não emite a newline final, então o hook "consertava" o
# dist, o próximo `npm run build` desfazia e todo commit virava ruído em ~40
# arquivos gerados — o diff real ficava escondido no meio. Arquivo gerado não é
# arquivo autoral.
#
# Os hooks de CHECAGEM (check-json, check-yaml, check-added-large-files)
# continuam valendo no dist: eles não modificam nada, só denunciam.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Âncora reusada nos outros hooks que escrevem em arquivo.
        exclude: &artefato_de_build ^desktop/dist/
      - id: end-of-file-fixer
        exclude: *artefato_de_build
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinado na MESMA linha do ruff do projeto (backend/requirements-dev.txt =
    # `ruff>=0.16.8`). Estava em v0.6.9: o hook formatava com uma versao de
    # 2024 enquanto o desenvolvedor roda a 0.16 — o formatter do hook desfazia
    # o do projeto e o commit virava ruido em ~20 arquivos (o inverso da
    # intencao de ter um hook).
    rev: v0.16.8
    hooks:
      # `types_or: [python, pyi]` em ambos os hooks: a partir da 0.16 o ruff
      # tambem le/formata blocos de codigo dentro de markdown, e sem a
      # restricao o hook passaria a reescrever e a linicar as fences de Python
      # dos dezenas de .md do repo — mudanca de comportamento que nao foi
      # pedida e que faria o `--all-files` acusar documentacao. Restringir
      # preserva o que o hook fazia antes do bump.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: *artefato_de_build
      - id: ruff-format
        types_or: [python, pyi]
        exclude: *artefato_de_build
