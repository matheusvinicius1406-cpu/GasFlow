[mypy]
python_version = 3.12
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = .

# ── BASELINE mypy (Onda 5.1, apertado na Onda D em 2026-10-15) ───────────
# Modulos legados com ignore_errors temporario. Ratchet: arquivo NOVO nao
# entra nesta lista (nasce verificado). Regra: ao tocar um modulo abaixo,
# corrigir os erros dele e REMOVER a secao. Nao adicionar secoes novas.
# Meta: apagar este bloco inteiro.
#
# Medicao de 2026-10-15 (Onda D/H4), rodando `mypy` com o bloco removido:
#   610 erros em 53 modulos  ->  566 erros em 31 modulos.
# Os 22 modulos que sairam estavam em 0 erro (5 ja estavam) ou foram
# corrigidos de fato nesta onda (rate_limit, reorder, segmentation, websocket,
# daily_report, alerts_webhook, payment.service, triggers, workflow_engine,
# agent_engine, auth_service, financial/order use_cases, finance.payments,
# finance.reports, database.connection, route_repository.list_by_tenant,
# automation.py) — mais `application.whatsapp.use_cases`, codigo morto
# removido (nao importado por nada e nem importavel).
#
# Causa raiz dos 566 restantes (medida, nao suposta): ~90% e o mesmo padrao —
# model SQLAlchemy no estilo legado (`x = Column(...)`) faz o mypy tipar o
# ATRIBUTO da instancia como `Column[str]` em vez de `str`, e cada consumidor
# vira erro `arg-type`/`assignment`. Sao 572 declaracoes `Column(` em 21
# modelos; os 5 modelos novos ja usam `Mapped[...]` (contact_job, coupon,
# driver_stock, ibge, print_job) e servem de referencia. Migrar os 21 modelos
# para `Mapped[X] = mapped_column(...)` e a proxima onda de tipagem — resolve
# a maioria desses 566 de uma vez, sem mudar comportamento.

