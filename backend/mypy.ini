[mypy]
python_version = 3.12
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = .

# ── BASELINE mypy (Onda 5.1, apertado na Onda D em 2026-10-15) ───────────
# Modulos legados com ignore_errors temporario. Ratchet: arquivo NOVO nao
# entra nesta lista (nasce verificado). Regra: ao tocar um modulo abaixo,
# corrigir os erros dele e REMOVER a secao. Nao adicionar secoes novas.
# Meta: apagar este bloco inteiro.
#
# Medicao de 2026-10-15 (Onda D/H4), rodando `mypy` com o bloco removido:
#   610 erros em 53 modulos  ->  566 erros em 31 modulos.
# Medicao de 2026-10-16 (Onda D/H4 — os 22 modelos migrados p/ `Mapped[...]`):
#   com o bloco INTEIRO removido: 566 erros em 31 modulos -> **165 erros em
#   21 modulos** (~400 erros eram o padrao `Column[str]` do model). 7 modulos
#   ficaram em 0 e tiveram a secao removida: application.contacts.reactivate,
#   application.coupon.coupon_service, application.settings.settings_service,
#   infrastructure.ai.repositories, repositories.route_repository,
#   repositories.segmentation_repository, presentation.api.integrations.
# Os 22 modulos que sairam estavam em 0 erro (5 ja estavam) ou foram
# corrigidos de fato nesta onda (rate_limit, reorder, segmentation, websocket,
# daily_report, alerts_webhook, payment.service, triggers, workflow_engine,
# agent_engine, auth_service, financial/order use_cases, finance.payments,
# finance.reports, database.connection, route_repository.list_by_tenant,
# automation.py) — mais `application.whatsapp.use_cases`, codigo morto
# removido (nao importado por nada e nem importavel).
#
# Causa raiz dos 566 (medida, nao suposta): ~90% e o mesmo padrao — model
# SQLAlchemy no estilo legado (`x = Column(...)`) faz o mypy tipar o ATRIBUTO
# da instancia como `Column[str]` em vez de `str`, e cada consumidor vira erro
# `arg-type`/`assignment`. **JA FEITO em 2026-10-16**: os 22 arquivos de modelo
# foram migrados para `Mapped[X] = mapped_column(...)` preservando a nullability
# (o `test_migrations_schema_alignment` exige model == Alembic), sem mudar
# comportamento — derrubou 566 -> 165. Os 165 restantes sao consumidores reais
# (client.use_cases 36, whatsapp.gateway 34, operations 16, delivery_ops 10,
# inventory/vehicle/whatsapp_automation_repository 8 cada...) — proxima onda.

