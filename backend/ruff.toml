line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI usa Depends()/Query() como valor default de parâmetro — é idiomático.
# UP042: mantemos `str, Enum` de propósito (compatibilidade ampla entre bancos).
ignore = ["B008", "UP042"]

[lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
