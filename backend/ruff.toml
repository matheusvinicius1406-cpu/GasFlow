# Ruff do backend GasFlow (gate de CI).
#
# Era o ÚNICO config do repositório, e por isso os outros diretórios (relay,
# scripts, .github/scripts, agent) ficavam com o default implícito da versão do
# ruff instalada — que mudou entre a 0.6.9 e a 0.16. As REGRAS passaram para
# `../ruff.toml` (raiz do repositório), que este arquivo estende: uma fonte de
# verdade, e o mesmo conjunto de regras vale para todo o repo.
#
# `line-length`/`target-version` continuam aqui: são opções de formatação do
# backend e não devem ser impostas aos outros diretórios.
extend = "../ruff.toml"
line-length = 120
target-version = "py312"
