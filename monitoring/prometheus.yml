global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Regras de alerta (avaliadas pelo Prometheus, enviadas ao Alertmanager)
rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gasflow-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: gasflow-whatsapp
    metrics_path: /metrics
    static_configs:
      - targets: ["whatsapp:3000"]
