route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: gasflow-backend

receivers:
  - name: gasflow-backend
    webhook_configs:
      # Receiver próprio no backend GasFlow — registra o alerta em log
      # estruturado (integrável depois a Telegram/Slack/e-mail).
      #
      # Segurança: o backend exige o segredo compartilhado
      # (ALERTS_WEBHOOK_SECRET) em `X-Alert-Secret` ou `Authorization: Bearer`.
      # Em produção ele está sempre ligado (fail-closed: sem segredo o backend
      # responde 503 e sem header/certo responde 401 — ver alerts_webhook.py).
      #
      # Provisionamento: o valor NÃO está aqui no versionado. O compose monta
      # o segredo do ambiente (secrets.alerts_secret → environment:
      # ALERTS_WEBHOOK_SECRET) em /run/secrets/alerts_secret, e o Alertmanager
      # lê o arquivo em http_config (um arquivo em disco, fora de argv/logs).
      # O backend precisa do MESMO valor em ALERTS_WEBHOOK_SECRET.
      - url: "http://backend:8000/api/v1/webhooks/alerts"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alerts_secret
