server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # ── Static assets (long cache) ────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Métricas: nunca expostas pela borda ────────────
    # Prefix (não `= /metrics`): cobre /metrics, /metrics/ e /api/metrics
    # (este último é stripado pelo location /api e voltaria a /metrics).
    # O Prometheus fala direto com backend:8000/metrics e whatsapp:3000/metrics
    # na rede interna do compose, autenticado por Bearer (monitoring/prometheus.yml
    # + secret metrics_key). Sem estes blocos qualquer variação cairia no
    # fallback da SPA e devolveria index.html (200), mascarando um erro de
    # configuração — aqui é 404 explícito = fail-closed na borda.
    location /metrics {
        return 404;
    }
    location /api/metrics {
        return 404;
    }

    # ── SPA pages that collide with backend prefixes ──
    # /driver e /driver/login são rotas do React Router (DriverHomePage,
    # DriverLoginPage). Precisam de match EXATO (maior prioridade no nginx)
    # para não caírem no proxy /driver/ do backend.
    location = /driver {
        try_files $uri $uri/ /index.html;
    }
    location = /driver/ {
        try_files $uri $uri/ /index.html;
    }
    location = /driver/login {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API (namespaces COM /api no backend) ──
    # O backend FastAPI serve /api/v1/* e /api/driver/* (legado) COM o
    # prefixo — nginx passa adiante SEM strip. Matches prefixos mais
    # longos vencem /api abaixo.
    location /api/v1/ {
        client_max_body_size 16m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location /api/driver/ {
        client_max_body_size 16m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Backend API (strip /api) ──────────────────────
    # Rotas raiz do backend recebem /clients/*, /orders/*, etc.
    # Comportamento igual ao Vite dev proxy (vite.config.ts rewrite).
    location /api {
        # .vcf do renomeador: 10k contatos ≈ 3 MB (pico 20k ≈ 16 MB). Sem
        # isto vale o default de 1 MB e o upload quebra no nginx (Fase 2 §4).
        # `proxy_read_timeout` fica INTACTO de propósito: o job é
        # bounded-batch, cada request é curto.
        client_max_body_size 16m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Backend root-level routes: auth + driver (app mobile) ──
    # O app do entregador chama /auth/*, /driver/* e /ws direto na origem
    # (nginx porta 80). O backend serve /auth/* e /driver/* na raiz —
    # proxy SEM strip. Rotas SPA /driver e /driver/login são capturadas
    # pelos matches exatos acima (maior prioridade).
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location /driver/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Webhook do PSP (PIX) ───────────────────────────
    # Caminho raiz documentado em DEPLOY.md (POST /payments/webhook/pix).
    # Sem este location o fallback da SPA devolveria HTML no callback do banco
    # e a validação de assinatura falharia. As formas alternativas
    # /api/payments/webhook/pix (strip) e /api/v1/payments/webhook/pix também
    # chegam ao mesmo handler — nenhuma delas duplica prefixo no backend.
    location /payments/webhook/pix {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Backend root-level routes (health, docs) ──────
    # /ready é o readiness (database/redis/whatsapp) usado no pós-deploy;
    # /docs|openapi.json|redoc só respondem 200 quando DOCS_ENABLED=1.
    location ~ ^/(health|ready|docs|openapi\.json|redoc) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket realtime (backend /ws) ──────────────
    # Requires HTTP/1.1 + Upgrade headers, otherwise the WS handshake fails.
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback (must be last) ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
