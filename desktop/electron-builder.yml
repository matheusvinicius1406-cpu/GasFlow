appId: com.gasflow.desktop
productName: GasFlow Desktop
directories:
  output: release
  buildResources: build
# Auto-update (electron-updater): releases publicados no GitHub.
# releaseType: release evita draft (drafts não são vistos pelo updater).
publish:
  provider: github
  owner: matheusvinicius1406-cpu
  repo: GasFlow
  releaseType: release
files:
  - dist/**
  - package.json
# Módulos embutidos como recursos — rodam como subprocessos em produção:
#   <resources>/agent/dist/index.js        (AgentBridge, ELECTRON_RUN_AS_NODE)
#   <resources>/whatsapp/dist/server.js    (WhatsAppBridge, ELECTRON_RUN_AS_NODE)
#   <resources>/frontend/                  (React original, servido pelo FastAPI)
#   <resources>/backend/app/               (código Python — roda com python local)
extraResources:
  - from: ../backend
    to: backend
    filter:
      - app/**/*
      - requirements.txt
  - from: ../agent
    to: agent
    filter:
      - dist/**/*
      - node_modules/**/*
      - package.json
  - from: ../whatsapp
    to: whatsapp
    filter:
      - dist/**/*
      - node_modules/**/*
      - package.json
  - from: ../frontend/dist
    to: frontend
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: build/icon.ico
  publisherName: GasFlow
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GasFlow Desktop
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  artifactName: "GasFlow Desktop Setup ${version}.${ext}"
