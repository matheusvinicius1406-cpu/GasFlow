# ═══════════════════════════════════════════════════════════════
# GasFlow — Produção
# Diferenças vs docker-compose.yml (dev):
#   - Sem bind mount de source (imagens buildadas são a fonte)
#   - ENVIRONMENT=production por padrão
#   - Backend roda `alembic upgrade head` antes de subir a API
#   - Postgres e backend sem portas expostas (rede interna)
#   - Frontend (nginx) é a única porta pública (80); WhatsApp fica apenas
#     na rede interna e o pareamento usa uma rede administrativa/túnel.
#
# Uso:
#   cp .env.production.example .env.production   # preencha os valores
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ═══════════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:16-alpine
    container_name: gasflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gasflow}
      POSTGRES_USER: ${POSTGRES_USER:-gasflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gasflow} -d ${POSTGRES_DB:-gasflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: gasflow-redis
    # Sem volume: contadores de rate limit são efêmeros por natureza — perder
    # janelas num restart é aceitável e não vale custo de persistência.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gasflow-backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-gasflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gasflow}}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      - WHATSAPP_SERVICE_URL=${WHATSAPP_SERVICE_URL:-http://whatsapp:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:-60}
      - MARCOS_GAS_API_KEY=${MARCOS_GAS_API_KEY:?Set MARCOS_GAS_API_KEY}
      # Chave service-to-service (whatsapp → backend, header X-GasFlow-Key)
      - WHATSAPP_SERVICE_KEY=${MARCOS_GAS_API_KEY:?Set MARCOS_GAS_API_KEY}
      - RATE_LIMIT_MODE=${RATE_LIMIT_MODE:-redis}
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
      # Realtime entre workers: prod roda BACKEND_WORKERS=2 por padrão — cada
      # worker tem seu próprio Event Bus/ConnectionManager; o pub/sub Redis
      # propaga eventos entre eles (ver docs RT-01 / pubsub.py).
      - REALTIME_BACKEND=${REALTIME_BACKEND:-redis}
      - REALTIME_REDIS_URL=redis://redis:6379/0
      # Fila de aprovações (ações de alto risco): compartilhada entre workers —
      # aprovação criada por um worker precisa existir no worker do "aprovar".
      - APPROVAL_QUEUE_MODE=${APPROVAL_QUEUE_MODE:-redis}
      - APPROVAL_QUEUE_REDIS_URL=redis://redis:6379/0
    # Aplica migrations antes de servir — o schema em prod é do Alembic,
    # não do create_all do boot (que segue disponível p/ dev/tests).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-2}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: gasflow-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal

  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    container_name: gasflow-whatsapp
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - MARCOS_GAS_API_KEY=${MARCOS_GAS_API_KEY:?Set MARCOS_GAS_API_KEY}
      - ALLOW_INSECURE_AUTH=false
      # Bridge de mensagens recebidas → backend (POST /whatsapp/incoming)
      - GASFLOW_BACKEND_URL=http://backend:8000
      - GASFLOW_SERVICE_KEY=${MARCOS_GAS_API_KEY:?Set MARCOS_GAS_API_KEY}
      - WA_HEARTBEAT_INTERVAL_MIN=${WA_HEARTBEAT_INTERVAL_MIN:-5}
      - WA_SEND_MIN_INTERVAL_MS=${WA_SEND_MIN_INTERVAL_MS:-2000}
      - WA_SEND_MAX_INTERVAL_MS=${WA_SEND_MAX_INTERVAL_MS:-10000}
      - WA_CRITICAL_WEBHOOK_URL=${WA_CRITICAL_WEBHOOK_URL:-}
      - WA_LOG_LEVEL=${WA_LOG_LEVEL:-info}
      # Motor Baileys (dual-mode; rollback: WA_ENGINE=wwebjs)
      - WA_ENGINE=${WA_ENGINE:-baileys}
      - BAILEYS_AUTH_DIR=/app/baileys_auth
      # Higiene anti-ban (caps/warmup/cooldown/quiet hours/jitter)
      - WA_MINUTE_CAP=${WA_MINUTE_CAP:-20}
      - WA_HOURLY_CAP=${WA_HOURLY_CAP:-200}
      - WA_DAILY_CAP=${WA_DAILY_CAP:-1000}
      - WA_RECIPIENT_COOLDOWN_MIN=${WA_RECIPIENT_COOLDOWN_MIN:-60}
      - WA_QUIET_HOURS_ENABLED=${WA_QUIET_HOURS_ENABLED:-true}
      - WA_QUIET_HOURS_START=${WA_QUIET_HOURS_START:-22}
      - WA_QUIET_HOURS_END=${WA_QUIET_HOURS_END:-7}
      - WA_SEND_MEAN_MS=${WA_SEND_MEAN_MS:-3000}
      - WA_SEND_STDEV_MS=${WA_SEND_STDEV_MS:-1000}
      - WA_BROADCAST_ENABLED=${WA_BROADCAST_ENABLED:-true}
    volumes:
      - whatsapp_data:/app/data
      - whatsapp_auth:/app/wwebjs_auth
      - baileys_auth:/app/baileys_auth
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - internal

  # ── Observabilidade (Fase 16.3) ──────────────────────

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gasflow-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: gasflow-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gasflow-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  whatsapp_data:
    driver: local
  whatsapp_auth:
    driver: local
  baileys_auth:
    driver: local
  backups_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
