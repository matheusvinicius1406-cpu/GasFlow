services:

  # ── Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gasflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gasflow}
      POSTGRES_USER: ${POSTGRES_USER:-gasflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gasflow} -d ${POSTGRES_DB:-gasflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - gasflow

  # ── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gasflow-backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-gasflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gasflow}}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - WHATSAPP_SERVICE_URL=http://whatsapp:3000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:-60}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - gasflow

  # ── Frontend (React/Vite + Nginx) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: gasflow-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - gasflow

  # ── WhatsApp Service (whatsapp-web.js) ──────────────────
  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    container_name: gasflow-whatsapp
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - MARCOS_GAS_API_KEY=${MARCOS_GAS_API_KEY:-}
    ports:
      - "${WHATSAPP_PORT:-3001}:3000"
    volumes:
      - whatsapp_data:/app/data
      - whatsapp_auth:/app/wwebjs_auth
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - gasflow

networks:
  gasflow:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  whatsapp_data:
    driver: local
  whatsapp_auth:
    driver: local
  backups_data:
    driver: local
