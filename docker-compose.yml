services:

  # ── Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gasflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gasflow}
      POSTGRES_USER: ${POSTGRES_USER:-gasflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gasflow} -d ${POSTGRES_DB:-gasflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - gasflow

  # ── Redis (rate limit distribuído — opcional em dev) ─────
  redis:
    image: redis:7-alpine
    container_name: gasflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - gasflow

  # ── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gasflow-backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-gasflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gasflow}}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - WHATSAPP_SERVICE_URL=http://whatsapp:3000
      # Chave service-to-service (whatsapp → backend, header X-GasFlow-Key)
      - WHATSAPP_SERVICE_KEY=${MARCOS_GAS_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:-60}
      - RATE_LIMIT_MODE=${RATE_LIMIT_MODE:-memory}
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/0
      # WhatsApp provider: current (whatsapp-web.js) | evolution | baileys | cloud_api
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-current}
      # WhatsApp Business Cloud API (Meta) — canal oficial para campanhas
      - WHATSAPP_CLOUD_API_TOKEN=${WHATSAPP_CLOUD_API_TOKEN:-}
      - WHATSAPP_CLOUD_API_PHONE_NUMBER_ID=${WHATSAPP_CLOUD_API_PHONE_NUMBER_ID:-}
      - WHATSAPP_CLOUD_API_WABA_ID=${WHATSAPP_CLOUD_API_WABA_ID:-}
      - WHATSAPP_CLOUD_API_VERSION=${WHATSAPP_CLOUD_API_VERSION:-v21.0}
      - WHATSAPP_CLOUD_API_APP_SECRET=${WHATSAPP_CLOUD_API_APP_SECRET:-}
      - WHATSAPP_CLOUD_API_VERIFY_TOKEN=${WHATSAPP_CLOUD_API_VERIFY_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - gasflow

  # ── Frontend (React/Vite + Nginx) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: gasflow-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - gasflow

  # ── WhatsApp Service (whatsapp-web.js) ──────────────────
  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
      args:
        # 1 = imagem com Chromium (rollback wwebjs)
        BUILD_WWEBJS: ${WHATSAPP_BUILD_WWEBJS:-0}
    container_name: gasflow-whatsapp
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - MARCOS_GAS_API_KEY=${MARCOS_GAS_API_KEY:-}
      # Bridge de mensagens recebidas → backend (POST /whatsapp/incoming)
      - GASFLOW_BACKEND_URL=http://backend:8000
      - GASFLOW_SERVICE_KEY=${MARCOS_GAS_API_KEY:-}
      - WA_HEARTBEAT_INTERVAL_MIN=${WA_HEARTBEAT_INTERVAL_MIN:-5}
      - WA_SEND_MIN_INTERVAL_MS=${WA_SEND_MIN_INTERVAL_MS:-2000}
      - WA_SEND_MAX_INTERVAL_MS=${WA_SEND_MAX_INTERVAL_MS:-10000}
      # Anti-ban hygiene: caps, warmup, cooldown, quiet hours, pacing gaussiano
      - WA_MINUTE_CAP=${WA_MINUTE_CAP:-20}
      - WA_HOURLY_CAP=${WA_HOURLY_CAP:-200}
      - WA_DAILY_CAP=${WA_DAILY_CAP:-1000}
      - WA_RECIPIENT_COOLDOWN_MIN=${WA_RECIPIENT_COOLDOWN_MIN:-60}
      - WA_QUIET_HOURS_ENABLED=${WA_QUIET_HOURS_ENABLED:-true}
      - WA_QUIET_HOURS_START=${WA_QUIET_HOURS_START:-22}
      - WA_QUIET_HOURS_END=${WA_QUIET_HOURS_END:-7}
      - WA_SEND_MEAN_MS=${WA_SEND_MEAN_MS:-3000}
      - WA_SEND_STDEV_MS=${WA_SEND_STDEV_MS:-1000}
      # Kill-switch: false = serviço apenas conversacional (campanhas via Cloud API)
      - WA_BROADCAST_ENABLED=${WA_BROADCAST_ENABLED:-true}
      - WA_CRITICAL_WEBHOOK_URL=${WA_CRITICAL_WEBHOOK_URL:-}
      # Motor: baileys (WebSocket puro, default) | wwebjs (Chromium, rollback)
      - WA_ENGINE=${WA_ENGINE:-baileys}
      - BAILEYS_AUTH_DIR=/app/baileys_auth
      - WA_LOG_LEVEL=${WA_LOG_LEVEL:-info}
    ports:
      - "${WHATSAPP_PORT:-3001}:3000"
    volumes:
      - whatsapp_data:/app/data
      - whatsapp_auth:/app/wwebjs_auth
      - baileys_auth:/app/baileys_auth
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - gasflow

networks:
  gasflow:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  whatsapp_data:
    driver: local
  whatsapp_auth:
    driver: local
  baileys_auth:
    driver: local
  backups_data:
    driver: local
