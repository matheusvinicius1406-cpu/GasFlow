version: "3.9"

services:

  # ── Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gasflow-postgres
    environment:
      POSTGRES_DB: gasflow
      POSTGRES_USER: gasflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gasflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasflow -d gasflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gasflow-backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql://gasflow:gasflow@postgres:5432/gasflow}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - WHATSAPP_SERVICE_URL=http://whatsapp:3000
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Frontend (React/Vite) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gasflow-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── WhatsApp Service (whatsapp-web.js) ──────────────────
  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    container_name: gasflow-whatsapp
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - WA_PRIMARY_NAME=${WA_PRIMARY_NAME:-Marcos Gas}
      - WA_SECONDARY_NAME=${WA_SECONDARY_NAME:-Marcos Gas 2}
      - WA_PRIMARY_SESSION=/app/wwebjs_auth/primary
      - WA_SECONDARY_SESSION=/app/wwebjs_auth/secondary
      - MARCOS_GAS_API_KEY=${MARCOS_GAS_API_KEY:-}
    ports:
      - "3001:3000"
    volumes:
      - ./whatsapp/src:/app/src
      - whatsapp_data:/app/data
      - whatsapp_auth:/app/wwebjs_auth
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
    driver: local
  whatsapp_data:
    driver: local
  whatsapp_auth:
    driver: local
  backups_data:
    driver: local
