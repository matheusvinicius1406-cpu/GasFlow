# ═══════════════════════════════════════════════════════════════
# GasFlow — LABORATÓRIO isolado do perfil Home Server (OPS-01B)
#
# Terceiro arquivo da pilha: prod → homeserver → lab.
#   docker compose \
#     -p gasflow-hs-lab \
#     -f docker-compose.prod.yml \
#     -f docker-compose.homeserver.yml \
#     -f docker-compose.homeserver.lab.yml \
#     --env-file deploy/home-server/.env.lab config
#
# O que este arquivo separa do ambiente real:
#   - projeto Compose próprio (`gasflow-hs-lab`) → volumes e rede ganham o
#     prefixo `gasflow-hs-lab_` e NUNCA tocam nos volumes de produção;
#   - `container_name` com sufixo `-lab` → não colide com uma stack real
#     rodando na mesma máquina;
#   - única porta publicada é `127.0.0.1:8088` (frontend), em loopback:
#     não disputa a :80, não disputa `127.0.0.1:8000` do GasFlow Desktop e
#     não fica visível na LAN;
#   - `restart: "no"` → laboratório não volta sozinho depois de um teste
#     (nada de loop de restart consumindo CPU/HDD enquanto ninguém olha);
#   - broadcast do WhatsApp desligado → mesmo que alguém pareie um número
#     de teste, nenhuma campanha sai.
#
# Segredos: vêm de `deploy/home-server/.env.lab` (cópia do `.env.lab.example`,
# valores fictícios, fora do git). Nunca use os segredos de produção aqui.
# ═══════════════════════════════════════════════════════════════

name: gasflow-hs-lab

services:

  postgres:
    container_name: gasflow-hs-lab-postgres
    environment:
      POSTGRES_DB: gasflow_lab
      POSTGRES_USER: gasflow_lab
    restart: "no"

  redis:
    container_name: gasflow-hs-lab-redis
    restart: "no"

  backend:
    container_name: gasflow-hs-lab-backend
    environment:
      # Fixar o destino impede DATABASE_URL herdada do processo Compose de
      # apontar o backend do laboratório para um banco externo ou SQLite.
      DATABASE_URL: postgresql+psycopg2://gasflow_lab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/gasflow_lab
    restart: "no"

  frontend:
    container_name: gasflow-hs-lab-frontend
    # O compose de prod publica "${FRONTEND_PORT:-80}:80" e listas de ports
    # são somadas no merge. !override substitui a lista inteira (Compose
    # >= 2.24.4); o bind literal não pode ser aberto por FRONTEND_PORT herdada.
    ports: !override
      - "127.0.0.1:8088:80"
    restart: "no"

  whatsapp:
    container_name: gasflow-hs-lab-whatsapp
    environment:
      # Sem disparo de campanha no laboratório (higiene + segurança).
      - WA_BROADCAST_ENABLED=false
      # Nada de webhook externo apontando para o ambiente real.
      - WA_CRITICAL_WEBHOOK_URL=
    restart: "no"

  prometheus:
    container_name: gasflow-hs-lab-prometheus
    restart: "no"

  alertmanager:
    container_name: gasflow-hs-lab-alertmanager
    restart: "no"

  grafana:
    container_name: gasflow-hs-lab-grafana
    restart: "no"
