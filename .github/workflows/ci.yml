name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy baseline — novos arquivos nascem verificados)
        run: python -m mypy app
      - name: Test (pytest)
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test (vitest)
        run: npm test

  whatsapp:
    name: WhatsApp service (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp
    env:
      # Motor default é Baileys (sem Chromium); pular o download do Chrome
      # no post-install do puppeteer (storage.googleapis.com pode não estar
      # no allowlist da rede do runner). Rollback wwebjs usa a imagem Docker
      # com Chromium (BUILD_WWEBJS=1).
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (src/db.ts) exige Node >= 22.5; imagem prod usa 24
          node-version: "24"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc)
        run: npm run build
      - name: Test
        run: npm test

  agent:
    name: Agent (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc)
        run: npm run build
      - name: Test
        run: npm test

  migrations:
    name: Migrations (PostgreSQL, banco zerado)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gasflow_migrations
          POSTGRES_USER: gasflow
          POSTGRES_PASSWORD: migrations_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gasflow -d gasflow_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://gasflow:migrations_password@localhost:5432/gasflow_migrations
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      # A suíte roda em SQLite; o E2E/produção rodam em PostgreSQL. Sem este
      # job, uma query só de SQLite (`INSERT OR IGNORE`) passou despercebida e
      # derrubou o boot do stack E2E por dias. Roda a cadeia inteira num banco
      # zerado e confirma idempotência (segundo upgrade é no-op).
      - name: Upgrade do zero (alembic upgrade head)
        run: alembic upgrade head
      - name: Idempotência (upgrade repetido)
        run: alembic upgrade head

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Boot E2E stack (postgres + redis + backend + frontend/nginx)
        run: |
          # Em falha, imprime os logs de quem não subiu: sem isso o job só
          # dizia "dependency failed to start" e a causa ficava invisível.
          docker compose -f docker-compose.e2e.yml up -d --build || {
            echo "::error::stack E2E não subiu — logs dos serviços abaixo"
            docker compose -f docker-compose.e2e.yml ps
            docker compose -f docker-compose.e2e.yml logs --tail=200
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright + chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        env:
          ADMIN_PASSWORD: admin123
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  trivy:
    name: Trivy (scan de vulnerabilidades)
    runs-on: ubuntu-latest
    needs: [backend, frontend, whatsapp, agent]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t gasflow-backend ./backend
          docker build -t gasflow-frontend ./frontend
          docker build -t gasflow-whatsapp ./whatsapp
          docker build -t gasflow-agent ./agent
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-frontend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan whatsapp
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-whatsapp
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan agent
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-agent
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Nota: SARIF upload (github/codeql-action/upload-sarif) exige repo
      # privado ou GitHub Advanced Security. Log no job basta para CI público.
