name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy baseline — novos arquivos nascem verificados)
        run: python -m mypy app
      - name: Test (pytest)
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test (vitest)
        run: npm test

  whatsapp:
    name: WhatsApp service (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp
    env:
      # Motor default é Baileys (sem Chromium); pular o download do Chrome
      # no post-install do puppeteer (storage.googleapis.com pode não estar
      # no allowlist da rede do runner). Rollback wwebjs usa a imagem Docker
      # com Chromium (BUILD_WWEBJS=1).
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (src/db.ts) exige Node >= 22.5; imagem prod usa 24
          node-version: "24"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc)
        run: npm run build
      - name: Test
        run: npm test

  agent:
    name: Agent (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc)
        run: npm run build
      - name: Test
        run: npm test

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Boot E2E stack (postgres + redis + backend + frontend/nginx)
        run: docker compose -f docker-compose.e2e.yml up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright + chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        env:
          ADMIN_PASSWORD: admin123
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  trivy:
    name: Trivy (scan de vulnerabilidades)
    runs-on: ubuntu-latest
    needs: [backend, frontend, whatsapp, agent]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t gasflow-backend ./backend
          docker build -t gasflow-frontend ./frontend
          docker build -t gasflow-whatsapp ./whatsapp
          docker build -t gasflow-agent ./agent
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-frontend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan whatsapp
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-whatsapp
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan agent
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-agent
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Nota: SARIF upload (github/codeql-action/upload-sarif) exige repo
      # privado ou GitHub Advanced Security. Log no job basta para CI público.
