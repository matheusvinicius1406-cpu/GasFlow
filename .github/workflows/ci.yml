name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# `cancel-in-progress` só em pull_request. Em push para a main, cancelar a run
# anterior derruba a CI de um commit que já pode ser base de release: o gate do
# release.yml exige uma run de CI **concluída e verde** no commit da tag, e foi
# assim que a CI da v1.1.7 foi cancelada por um push posterior — o release ficou
# preso sem nada de errado no código.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.14 e não 3.12: é o interpretador de produção
          # (`backend/Dockerfile` = python:3.14-slim). Validar em versão
          # diferente da que roda em campo valida o código errado.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy baseline — novos arquivos nascem verificados)
        run: python -m mypy app
      - name: Test (pytest)
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test (vitest)
        run: npm test

  whatsapp:
    name: WhatsApp service (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp
    env:
      # Motor default é Baileys (sem Chromium); pular o download do Chrome
      # no post-install do puppeteer (storage.googleapis.com pode não estar
      # no allowlist da rede do runner). Rollback wwebjs usa a imagem Docker
      # com Chromium (BUILD_WWEBJS=1).
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite (src/db.ts) exige Node >= 22.5; imagem prod usa 24
          node-version: "24"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc)
        run: npm run build
      - name: Test
        run: npm test

  agent:
    name: Agent (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (tsc)
        run: npm run build
      - name: Test
        run: npm test

  migrations:
    name: Migrations (PostgreSQL, banco zerado)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gasflow_migrations
          POSTGRES_USER: gasflow
          POSTGRES_PASSWORD: migrations_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gasflow -d gasflow_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://gasflow:migrations_password@localhost:5432/gasflow_migrations
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Mesma versão do job `backend` (3.14 = produção), para que a
          # migração seja ensaiada no interpretador em que vai rodar.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      # A suíte roda em SQLite; o E2E/produção rodam em PostgreSQL. Sem este
      # job, uma query só de SQLite (`INSERT OR IGNORE`) passou despercebida e
      # derrubou o boot do stack E2E por dias. Roda a cadeia inteira num banco
      # zerado e confirma idempotência (segundo upgrade é no-op).
      - name: Upgrade do zero (alembic upgrade head)
        run: alembic upgrade head
      - name: Idempotência (upgrade repetido)
        run: alembic upgrade head

  # O E2E (Playwright, stack docker-compose.e2e.yml) roda no workflow
  # separado `.github/workflows/e2e.yml` — até 2026-10-09 havia um job `e2e`
  # aqui também, e o stack subia duas vezes por push. O gate do release.yml
  # só exige os 4 jobs de teste (backend/frontend/whatsapp/agent).
  # Diagnóstico: docs/ci/RELATORIO-CI-2026-10-09.md.

  trivy:
    name: Trivy (scan de vulnerabilidades)
    runs-on: ubuntu-latest
    needs: [backend, frontend, whatsapp, agent]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t gasflow-backend ./backend
          docker build -t gasflow-frontend ./frontend
          docker build -t gasflow-whatsapp ./whatsapp
          docker build -t gasflow-agent ./agent
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-frontend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan whatsapp
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-whatsapp
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan agent
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gasflow-agent
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Nota: SARIF upload (github/codeql-action/upload-sarif) exige repo
      # privado ou GitHub Advanced Security. Log no job basta para CI público.
