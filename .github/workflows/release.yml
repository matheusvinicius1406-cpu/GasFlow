name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & publish Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python for bundled backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build bundled backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --clean --noconfirm gasflow-backend.spec

      - name: Install deps
        run: npm ci

      # build:win também compila agent, whatsapp e frontend (--prefix ../<pkg>).
      # Em um runner limpo cada um precisa do próprio npm ci (tsc/vite vêm dos
      # devDependencies de cada projeto, não do desktop).
      - name: Install sibling deps
        run: |
          npm ci --prefix ../agent
          npm ci --prefix ../whatsapp
          npm ci --prefix ../frontend

      - name: Build signed installer candidate
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: npm run build:win

      - name: Require Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          if (-not $installer) { throw 'Instalador não foi gerado.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Assinatura Authenticode inválida: $($signature.Status)"
          }

      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win --publish always

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v7
        with:
          name: gasflow-windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          retention-days: 30
