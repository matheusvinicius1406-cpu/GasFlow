name: Release

on:
  push:
    tags:
      - "v*"

# `actions: read` é o que permite ao gate ler as runs/jobs do CI — declarar
# `permissions` zera todo escopo não listado, e sem ele a consulta à API
# voltaria 403.
permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI gate (backend/frontend/whatsapp/agent)
    runs-on: ubuntu-latest
    # 80 > os 75 min do TIMEOUT_S do ci_gate.py (+ folga para checkout e
    # consultas de API). Com 45 o runner matava o gate no meio do prazo novo.
    timeout-minutes: 80
    steps:
      # Sem o checkout o workspace está vazio e `python3 .github/scripts/
      # ci_gate.py` morre com "No such file or directory" (exit 2) antes de
      # consultar o CI — foi o que reprovou a primeira tag que usou o gate.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Aguarda CI do commit da tag e confere os 4 jobs de teste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_gate.py

  build-windows:
    name: Build & publish Windows installer
    runs-on: windows-latest
    needs: [ci-gate]
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 (e não 20): `build:win` também compila o frontend, e o
          # Vite 8 exige ^20.19 || >=22.12 — mesma versão que o job
          # `frontend` do ci.yml usa para validar esse build.
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python for bundled backend
        uses: actions/setup-python@v7
        with:
          # 3.14 = o interpretador que roda em campo (`backend/Dockerfile`).
          # O instalador era compilado no 3.12 e usado no 3.14 — o artefato
          # publicado não vinha do interpretador em que ele roda. Validado
          # localmente: spec compila no 3.14.6 com PyInstaller 6.22.3, o exe
          # sobe, aplica a cadeia Alembic e responde /health.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build bundled backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --clean --noconfirm gasflow-backend.spec

      - name: Install deps
        run: npm ci

      # build:win também compila agent, whatsapp e frontend (--prefix ../<pkg>).
      # Em um runner limpo cada um precisa do próprio npm ci (tsc/vite vêm dos
      # devDependencies de cada projeto, não do desktop).
      - name: Install sibling deps
        run: |
          npm ci --prefix ../agent
          npm ci --prefix ../whatsapp
          npm ci --prefix ../frontend

      # O electron-builder baixa binários próprios (electron, nsis, winCodeSign)
      # a cada build; na v1.1.7 o download morreu com "504 Gateway Time-out" do
      # host de binários e derrubou o release sem nada de errado no código. Com
      # o cache, essas dependências passam a vir do cache do Actions.
      - name: Cache do toolchain do electron
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-toolchain-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            electron-toolchain-${{ runner.os }}-

      - name: Build installer candidate
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        # `shell: bash`: o shell padrão do windows-latest é PowerShell e o
        # comportamento dele em falha de comando nativo mudou no 7.4 — em bash
        # o retry fica explícito e não depende dessa diferença.
        shell: bash
        # --publish never: em build de tag o electron-builder tentaria publicar
        # aqui e morreria sem GH_TOKEN (o publish correto é o step seguinte).
        # Retry porque a falha conhecida deste passo é de rede (50x no download
        # do toolchain) — não vale perder o release por isso.
        run: |
          for attempt in 1 2 3; do
            if npm run build:win -- --publish never; then
              exit 0
            fi
            echo "::warning::build do instalador falhou na tentativa $attempt"
            sleep 20
          done
          echo "::error::build do instalador falhou nas 3 tentativas"
          exit 1

      - name: Publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
          TAG: ${{ github.ref_name }}
        shell: bash
        # A duplicação de releases (v1.1.3/v1.1.4/v1.1.6 ficaram com dois IDs
        # cada) vinha daqui: quando o electron-builder não encontra release
        # para a tag ele CRIA uma; se o step anterior criou/adicionou algo (ou
        # um re-run parcial subiu assets), o builder criava OUTRA em vez de
        # reusar. Pré-criar a release publicada para a tag ANTES do publish
        # garante que o builder encontre-a e apenas ANEXE os assets.
        run: |
          if gh release view "$TAG" --json id --jq '.id' >/dev/null 2>&1; then
            echo "release $TAG já existe — electron-builder vai anexar assets"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --draft=false
            echo "release $TAG pré-criada (pública) para o publish anexar"
          fi
          npx electron-builder --win --publish always

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v7
        with:
          name: gasflow-windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          retention-days: 30

      # O publish do electron-builder pode terminar com sucesso deixando o
      # release incompleto: na v1.1.7 só o `.blockmap` subiu (o `.exe` de ~170MB
      # é o que falha primeiro) e o job passou verde — release publicado sem
      # instalador, e o auto-update sem `latest.yml` para ler. Falhar aqui é
      # melhor do que descobrir isso no cliente.
      - name: Confere que o release está publicado e completo
        # `shell: bash` é obrigatório: o runner é windows-latest e o shell
        # padrão lá é PowerShell, que não entende `$(...)`, `for ... do` nem
        # `grep -Eq` — o step morria em 1s sem checar nada.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "ativos em $TAG:"; printf '%s\n' "$assets"
          missing=""
          for pattern in '\.exe$' '\.exe\.blockmap$' '^latest\.yml$'; do
            printf '%s\n' "$assets" | grep -Eq "$pattern" || missing="$missing $pattern"
          done
          if [ -n "$missing" ]; then
            echo "::error::release $TAG incompleto — faltando:$missing"
            exit 1
          fi

          # Rascunho é pior que release ausente: o `gh` (autenticado) enxerga e
          # os ativos estão lá, mas o updater e o cliente não — release criado
          # pelo electron-builder sobre um rascunho anterior ficaria invisível.
          # `releaseType: release` no electron-builder.yml já evita isso; aqui a
          # asserção deixa o caso explícito e se autocorrige.
          draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$draft" = "true" ]; then
            echo "::warning::release $TAG estava como rascunho — publicando."
            gh release edit "$TAG" --draft=false
            draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          fi
          if [ "$draft" != "false" ]; then
            echo "::error::release $TAG não está publicado (isDraft=$draft)."
            exit 1
          fi

          url=$(gh release view "$TAG" --json url --jq '.url')
          echo "::notice::release $TAG publicado com instalador, blockmap e latest.yml — $url"

          # Unicidade: a história já teve releases duplicadas (mesma tag, dois
          # IDs). Se acontecer de novo, que o workflow aponte — mas não falhe
          # o release por isso (a mais recente é a que o updater lê).
          count=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq 'length' 2>/dev/null || echo "?")
          if [ "$count" != "1" ]; then
            echo "::warning::release $TAG duplicada (count=$count) — investigar publish concorrente."
          fi

          echo "### Release publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "[$TAG]($url) — instalador, blockmap e latest.yml." >> "$GITHUB_STEP_SUMMARY"
