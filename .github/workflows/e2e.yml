name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Subir stack E2E (docker-compose.e2e.yml)
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Aguardar stack saudável
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "stack E2E no ar (nginx :8080)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::stack E2E não ficou saudável em 5min"
          docker compose -f docker-compose.e2e.yml logs --tail=120
          exit 1

      - name: Deps E2E + navegador Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          # Mesma senha fixada no docker-compose.e2e.yml (ADMIN_PASSWORD=admin123)
          ADMIN_PASSWORD: admin123
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Derrubar stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
